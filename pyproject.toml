[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-score"
version = "0.1.0"
description = "FTP photo assessment service for lawn-parking detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=10,<13",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "ruff>=0.16,<1",
]

[project.scripts]
parking-score = "parking_score.__main__:main"

[tool.setuptools.packages.find]
include = ["parking_score*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
